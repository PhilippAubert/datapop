version: "3.8"

services:
  server:
    build: ./server
    container_name: datapop_backend
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env  
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/datapop

  frontend:
    build: ./frontend
    container_name: datapop_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
